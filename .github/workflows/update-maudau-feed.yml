name: Update Maudau XML

on:
  schedule:
    # Auto-generated from Configurator. Times are Europe/Kyiv; GitHub cron is UTC (current UTC+3).
    - cron: '0 6 * * *'  # 09:00 Kyiv
    - cron: '0 17 * * *'  # 20:00 Kyiv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml awscli

      - name: Run update_maudau.py
        run: python update_maudau.py

      - name: Validate Cloudflare R2 configuration
        env:
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          for key in CF_R2_ACCOUNT_ID CF_R2_ACCESS_KEY_ID CF_R2_SECRET_ACCESS_KEY CF_R2_BUCKET_NAME; do
            if [ -z "${!key}" ]; then
              echo "Missing required GitHub secret: ${key}"
              exit 1
            fi
          done

      - name: Upload XML to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          CF_R2_OBJECT_KEY: update_maudau.xml
        run: |
          test -s update_maudau.xml
          aws s3 cp update_maudau.xml "s3://${CF_R2_BUCKET_NAME}/${CF_R2_OBJECT_KEY}" \
            --endpoint-url "https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/xml; charset=utf-8" \
            --cache-control "no-store, max-age=0"
